<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta_title"></title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="min-h-screen bg-white font-sans text-neutral-900 selection:bg-neutral-200">
  <!-- Minimalist Sticky Header (tucheng-store-rental style + Bilingual Capsule) -->
  <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 border-b"></header>

  <main>
    <!-- Hero Section -->
    <section id="hero" class="relative h-screen min-h-[700px] flex items-center justify-center"></section>
    <!-- The Space & Specifications Section -->
    <section id="space" class="py-24 lg:py-32 bg-white"></section>
    <!-- Multi-Plan Rental Comparison & Cost Calculator -->
    <section id="pricing" class="py-24 lg:py-32 bg-neutral-950 text-white"></section>
    <!-- Dynamic Photo Gallery (Firestore/Storage + Fallback) -->
    <section id="gallery" class="py-24 lg:py-32 bg-white"></section>
    <!-- Four Key Advantages -->
    <section id="advantages" class="py-24 lg:py-32 bg-neutral-50"></section>
    <!-- Transportation & Maps -->
    <section id="transportation" class="py-24 lg:py-32 bg-white"></section>
    <!-- FAQ Section -->
    <section id="faq" class="py-24 lg:py-32 bg-neutral-50"></section>
    <!-- Contact & Broker Collaboration Section -->
    <section id="contact" class="py-32 bg-neutral-900 text-white"></section>
  </main>

  <!-- Footer with Stealth Admin Trigger (5-click on copyright) -->
  <footer class="bg-neutral-950 text-neutral-500 py-12 text-center text-xs tracking-widest uppercase border-t border-neutral-900"></footer>
</body>
</html>
